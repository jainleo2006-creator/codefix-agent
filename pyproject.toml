[project]
name = "codefix-agent"
version = "0.1.0"
description = "Provider-agnostic AI software engineering agent (vertical slice)"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.30.0"]

[project.scripts]
codefix = "codefix.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codefix*"]
